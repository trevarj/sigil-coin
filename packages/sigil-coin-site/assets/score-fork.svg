<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 620" role="img" aria-labelledby="title desc">
  <title id="title">SigilCoin lottery odds and equal-unit fork choice</title>
  <desc id="desc">Bits encode producer length and complexity, saved bytes multiply nonce-lottery odds up to eight, and qualifying same-height blocks remain first-seen until a child settles the height.</desc>
  <defs><linearGradient id="lottery" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#a98cff"/><stop offset=".52" stop-color="#5ee7f1"/><stop offset="1" stop-color="#7df0af"/></linearGradient><filter id="soft"><feGaussianBlur stdDeviation="7"/></filter></defs>
  <style>.panel{fill:#10131f;stroke:#303650}.muted{fill:#aaa9bd;font:500 13px ui-monospace,monospace}.head{fill:#f5f3ff;font:700 17px ui-sans-serif,system-ui}.wire{fill:none;stroke:#4c536d;stroke-width:3}.winner{stroke:url(#lottery);stroke-width:4;stroke-dasharray:10 10;animation:move 4s linear infinite}.node{fill:#151a29;stroke:#5a6383;stroke-width:2}.win{stroke:#5ee7f1;filter:url(#soft)}.bar{fill:url(#lottery);animation:breathe 3s ease-in-out infinite;transform-origin:left}@keyframes move{to{stroke-dashoffset:-80}}@keyframes breathe{50%{opacity:.65}}@media(prefers-reduced-motion:reduce){.winner,.bar{animation:none}}</style>
  <rect class="panel" x="36" y="28" width="688" height="220" rx="24"/><text class="head" x="70" y="66">Program savings weight the header lottery</text><text class="muted" x="70" y="96">bits: 0x206 prefix · L−1 in 20..12 · C in 11..0</text><text class="muted" x="70" y="124">nonce: uint32 searched automatically · roll: HASH256(full header)</text><text class="muted" x="70" y="154">C=128</text><text class="muted" x="145" y="154">par</text><rect class="bar" x="205" y="140" width="28" height="18" rx="9"/><text class="muted" x="245" y="154">1× · 4096 expected</text><text class="muted" x="145" y="184">par−1</text><rect class="bar" x="205" y="170" width="56" height="18" rx="9"/><text class="muted" x="273" y="184">2× · 2048 expected</text><text class="muted" x="145" y="214">par−8</text><rect class="bar" x="205" y="200" width="250" height="18" rx="9"/><text class="muted" x="467" y="214">256× · 16 expected</text>
  <text class="head" x="36" y="305">Qualifying blocks have equal unit weight</text><path class="wire" d="M92 398H250M250 398C320 398 325 350 390 350H500M250 398C320 398 325 468 390 468H500"/><path class="wire winner" d="M250 398C320 398 325 350 390 350H655"/>
  <g><rect class="node" x="48" y="361" width="88" height="74" rx="14"/><text class="muted" x="92" y="392" text-anchor="middle">H 481</text><text class="muted" x="92" y="415" text-anchor="middle">settled</text></g>
  <g><rect class="node win" x="390" y="313" width="140" height="74" rx="14"/><text class="head" x="460" y="345" text-anchor="middle">H 482</text><text class="muted" x="460" y="369" text-anchor="middle">FIRST SEEN</text></g>
  <g><rect class="node" x="390" y="431" width="140" height="74" rx="14"/><text class="head" x="460" y="463" text-anchor="middle">H 482</text><text class="muted" x="460" y="487" text-anchor="middle">LATER SIBLING</text></g>
  <g><rect class="node win" x="620" y="313" width="104" height="74" rx="14"/><text class="head" x="672" y="345" text-anchor="middle">H 483</text><text class="muted" x="672" y="369" text-anchor="middle">SETTLES</text></g>
  <text class="muted" x="36" y="555">Settled branch · taller chain · first valid arrival</text><text class="muted" x="36" y="587">No length, share, nonce, or hash sibling tie-break</text>
</svg>
