<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 620" role="img" aria-labelledby="title desc">
  <title id="title">SigilCoin authenticated score and projected fork rank</title><desc id="desc">Chains compare height first, then the projected producer rank of length, memory, and steps. Share quality is authenticated but does not break ties.</desc>
  <defs><linearGradient id="rank" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#a98cff"/><stop offset=".52" stop-color="#5ee7f1"/><stop offset="1" stop-color="#7df0af"/></linearGradient><filter id="soft"><feGaussianBlur stdDeviation="7"/></filter></defs>
  <style>.panel{fill:#10131f;stroke:#303650}.muted{fill:#aaa9bd;font:500 14px ui-monospace,monospace}.head{fill:#f5f3ff;font:700 18px ui-sans-serif,system-ui}.wire{fill:none;stroke:#4c536d;stroke-width:3}.winner{stroke:url(#rank);stroke-width:4;stroke-dasharray:10 10;animation:move 4s linear infinite}.node{fill:#151a29;stroke:#5a6383;stroke-width:2}.win{stroke:#5ee7f1;filter:url(#soft)}.bar{animation:breathe 3s ease-in-out infinite;transform-origin:left}@keyframes move{to{stroke-dashoffset:-80}}@keyframes breathe{50%{opacity:.65}}@media(prefers-reduced-motion:reduce){.winner,.bar{animation:none}}</style>
  <rect class="panel" x="36" y="35" width="688" height="190" rx="24"/><text class="head" x="70" y="76">32-bit score W · fork rank clears Q</text>
  <g transform="translate(70 105)"><rect width="258" height="58" rx="10" fill="#43356e"/><rect x="258" width="118" height="58" fill="#244f62"/><rect x="376" width="118" height="58" fill="#2c4d47"/><rect x="494" width="82" height="58" fill="#573c59"/><rect x="576" width="66" height="58" rx="10" fill="#24283a"/><text class="muted" x="129" y="27" text-anchor="middle" fill="#fff">LENGTH · 10</text><text class="muted" x="317" y="27" text-anchor="middle">MEM · 7</text><text class="muted" x="435" y="27" text-anchor="middle">STEPS · 7</text><text class="muted" x="535" y="27" text-anchor="middle">15−Q AUTH</text><text class="muted" x="609" y="27" text-anchor="middle">0000</text><text class="muted" x="247" y="84" text-anchor="middle">projected rank · lower wins →</text><text class="muted" x="535" y="84" text-anchor="middle">report only</text></g>
  <text class="head" x="36" y="282">Fork at equal height</text><path class="wire" d="M92 380H250M250 380C320 380 325 320 390 320H500M250 380C320 380 325 455 390 455H500"/><path class="wire winner" d="M250 380C320 380 325 320 390 320H655"/><path class="wire" d="M500 455H655"/>
  <g><rect class="node" x="48" y="343" width="88" height="74" rx="14"/><text class="muted" x="92" y="374" text-anchor="middle">H 481</text><text class="muted" x="92" y="397" text-anchor="middle">settled</text></g>
  <g><rect class="node win" x="390" y="283" width="135" height="74" rx="14"/><text class="head" x="457" y="315" text-anchor="middle">H 482</text><text class="muted" x="457" y="339" text-anchor="middle">RW 0x094…</text></g>
  <g><rect class="node" x="390" y="418" width="135" height="74" rx="14"/><text class="head" x="457" y="450" text-anchor="middle">H 482</text><text class="muted" x="457" y="474" text-anchor="middle">RW 0x0c1…</text></g>
  <g class="bar"><rect x="548" y="293" width="150" height="54" rx="27" fill="#162c32" stroke="#5ee7f1"/><text x="623" y="326" text-anchor="middle" fill="#7df0af" font-family="ui-monospace,monospace" font-size="15">LOWER RANK WINS</text></g>
  <text class="muted" x="36" y="555">01 · Greater height wins</text><text class="muted" x="267" y="555">02 · Lower projected rank wins at equal height</text><text class="muted" x="36" y="588">03 · Equal rank keeps incumbent until child settlement; no Q or hash tie-break</text>
</svg>
