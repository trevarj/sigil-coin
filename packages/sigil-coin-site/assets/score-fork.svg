<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 620" role="img" aria-labelledby="title desc">
  <title id="title">SigilCoin longest-height forks and hardcoded release checkpoints</title>
  <desc id="desc">Golf score measures competition quality only and does not select branches or currently alter subsidy. A strictly taller valid branch wins; equal height keeps the durable active incumbent, including after restart, regardless of score, hash or arrival metadata. Hardcoded height and internal-hash checkpoints block incompatible branches. Initially H0 pins only genesis; nontrivial finality requires a reviewed release pinning H1 or higher and nodes must upgrade to share it. Cheap equal-height forks, missed-slot takeover opportunities, partitions and reorgs above the latest checkpoint remain possible.</desc>
  <defs><linearGradient id="score" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#a98cff"/><stop offset=".52" stop-color="#5ee7f1"/><stop offset="1" stop-color="#7df0af"/></linearGradient><filter id="soft"><feGaussianBlur stdDeviation="7"/></filter></defs>
  <style>.panel{fill:#10131f;stroke:#303650}.muted{fill:#aaa9bd;font:500 13px ui-monospace,monospace}.head{fill:#f5f3ff;font:700 17px ui-sans-serif,system-ui}.wire{fill:none;stroke:#4c536d;stroke-width:3}.winner{stroke:url(#score);stroke-width:4;stroke-dasharray:10 10;animation:move 4s linear infinite}.node{fill:#151a29;stroke:#5a6383;stroke-width:2}.win{stroke:#5ee7f1;filter:url(#soft)}.bar{fill:url(#score);animation:breathe 3s ease-in-out infinite;transform-origin:left}@keyframes move{to{stroke-dashoffset:-80}}@keyframes breathe{50%{opacity:.65}}@media(prefers-reduced-motion:reduce){.winner,.bar{animation:none}}</style>
  <rect class="panel" x="36" y="28" width="688" height="220" rx="24"/><text class="head" x="70" y="66">Golf score: competition quality, not fork weight</text><text class="muted" x="70" y="96">Hardcoded release checkpoints pin (height . internal-hash)</text><text class="muted" x="70" y="124">H0 pins genesis only; later pins require release upgrades</text><text class="muted" x="70" y="154">length</text><text class="muted" x="145" y="154">par</text><rect class="bar" x="205" y="140" width="28" height="18" rx="9"/><text class="muted" x="245" y="154">1 point · valid fallback</text><text class="muted" x="145" y="184">par−1</text><rect class="bar" x="205" y="170" width="56" height="18" rx="9"/><text class="muted" x="273" y="184">2 points</text><text class="muted" x="145" y="214">par−8</text><rect class="bar" x="205" y="200" width="250" height="18" rx="9"/><text class="muted" x="467" y="214">9 points · maximum</text>
  <text class="head" x="36" y="305">Strictly taller valid branch wins</text><path class="wire" d="M92 398H250M250 398C320 398 325 350 390 350H500M250 398C320 398 325 468 390 468H500"/><path class="wire winner" d="M250 398C320 398 325 350 390 350H655"/>
  <g><rect class="node" x="48" y="361" width="88" height="74" rx="14"/><text class="muted" x="92" y="392" text-anchor="middle">PIN</text><text class="muted" x="92" y="415" text-anchor="middle">H0</text></g>
  <g><rect class="node win" x="390" y="313" width="140" height="74" rx="14"/><text class="head" x="460" y="345" text-anchor="middle">HEIGHT 1</text><text class="muted" x="460" y="369" text-anchor="middle">1 golf point</text></g>
  <g><rect class="node" x="390" y="431" width="140" height="74" rx="14"/><text class="head" x="460" y="463" text-anchor="middle">HEIGHT 1</text><text class="muted" x="460" y="487" text-anchor="middle">9 golf points</text></g>
  <g><rect class="node win" x="620" y="313" width="104" height="74" rx="14"/><text class="head" x="672" y="345" text-anchor="middle">HEIGHT 2</text><text class="muted" x="672" y="369" text-anchor="middle">WINS</text></g>
  <text class="muted" x="36" y="555">Equal height keeps the durable active incumbent, even on restart</text><text class="muted" x="36" y="587">Reorgs above latest pin · cheap forks · missed slots · partitions</text>
</svg>
