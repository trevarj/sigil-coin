<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" role="img" aria-labelledby="title desc">
  <title id="title">SigilCoin program-weighted nonce lottery</title>
  <desc id="desc">A deterministic puzzle yields an eligible short program. Its length sets the target multiplier, then the coinbase lock-time and header nonce are searched until the full-header HASH256 roll meets the target.</desc>
  <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#a98cff"/><stop offset=".5" stop-color="#5ee7f1"/><stop offset="1" stop-color="#ff70b5"/></linearGradient><filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
  <style>.box{fill:#111522;stroke:#343a54}.wire{fill:none;stroke:#59617e;stroke-width:2;stroke-dasharray:8 10;animation:dash 5s linear infinite}.hot{stroke:url(#g);filter:url(#glow)}.label{fill:#aaa9bd;font:600 14px ui-monospace,monospace}.code{fill:#f5f3ff;font:700 17px ui-monospace,monospace}.ok{fill:#7df0af;font:700 14px ui-monospace,monospace}.pulse{animation:pulse 2.8s ease-in-out infinite;transform-origin:center}@keyframes dash{to{stroke-dashoffset:-72}}@keyframes pulse{50%{opacity:.6;transform:scale(.98)}}@media(prefers-reduced-motion:reduce){.wire,.pulse{animation:none}}</style>
  <path class="wire hot" d="M170 280H290M510 280H635"/>
  <g><rect class="box pulse" x="30" y="205" width="140" height="150" rx="24"/><text class="label" x="100" y="245" text-anchor="middle">PUZZLE</text><text class="code" x="100" y="285" text-anchor="middle">x → ?</text><text class="label" x="100" y="320" text-anchor="middle">examples + rule</text></g>
  <g><rect class="box" x="290" y="185" width="220" height="190" rx="20"/><text class="label" x="400" y="225" text-anchor="middle">ELIGIBLE PROGRAM</text><text class="code" x="400" y="270" text-anchor="middle">(lambda(x)…)</text><text class="label" x="400" y="310" text-anchor="middle">L = par − 5</text><text class="ok" x="400" y="345" text-anchor="middle">32× LOTTERY ODDS</text></g>
  <g class="pulse"><path d="M665 185h105v190H665l-30-30V215z" fill="#131827" stroke="url(#g)" stroke-width="2"/><text class="label" x="710" y="225" text-anchor="middle">BLOCK</text><text class="label" x="710" y="249" text-anchor="middle">CURSOR</text><text class="code" x="710" y="289" text-anchor="middle">lock,nonce</text><text class="label" x="710" y="324" text-anchor="middle">HASH256</text><text class="ok" x="710" y="350" text-anchor="middle">ROLL ≤ TARGET</text></g>
  <text class="label" x="400" y="455" text-anchor="middle">Search nonce · advance coinbase lock-time and merkle on exhaustion</text>
  <text class="label" x="400" y="492" text-anchor="middle">Shorter improves odds; it does not deterministically win.</text>
</svg>
