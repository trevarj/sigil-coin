<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" role="img" aria-labelledby="title desc">
  <title id="title">SigilCoin mining flow</title><desc id="desc">A puzzle fans out to candidate programs; the shortest valid program becomes a block.</desc>
  <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#a98cff"/><stop offset=".5" stop-color="#5ee7f1"/><stop offset="1" stop-color="#ff70b5"/></linearGradient><filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
  <style>.box{fill:#111522;stroke:#343a54}.wire{fill:none;stroke:#59617e;stroke-width:2;stroke-dasharray:8 10;animation:dash 5s linear infinite}.hot{stroke:url(#g);filter:url(#glow)}.label{fill:#aaa9bd;font:600 15px ui-monospace,monospace}.code{fill:#f5f3ff;font:700 18px ui-monospace,monospace}.pulse{animation:pulse 2.8s ease-in-out infinite;transform-origin:center}@keyframes dash{to{stroke-dashoffset:-72}}@keyframes pulse{50%{opacity:.55;transform:scale(.98)}}@media(prefers-reduced-motion:reduce){.wire,.pulse{animation:none}}</style>
  <path class="wire hot" d="M160 280C250 280 250 120 345 120M160 280C250 280 250 220 345 220M160 280C250 280 250 340 345 340M160 280C250 280 250 440 345 440"/>
  <path class="wire hot" d="M535 120C615 120 590 280 670 280M535 220C610 220 610 280 670 280M535 340C610 340 610 280 670 280M535 440C615 440 590 280 670 280"/>
  <rect class="box pulse" x="35" y="215" width="125" height="130" rx="24"/><text class="label" x="97" y="252" text-anchor="middle">PUZZLE</text><text class="code" x="97" y="290" text-anchor="middle">x → ?</text><text class="label" x="97" y="320" text-anchor="middle">examples + rule</text>
  <g><rect class="box" x="345" y="80" width="190" height="80" rx="16"/><text class="code" x="365" y="116">(lambda(x)…)</text><text class="label" x="365" y="142">71 bytes · valid</text></g>
  <g><rect class="box" x="345" y="180" width="190" height="80" rx="16"/><text class="code" x="365" y="216">(lambda(x)…)</text><text class="label" x="365" y="242">38 bytes · valid</text></g>
  <g opacity=".55"><rect class="box" x="345" y="300" width="190" height="80" rx="16"/><text class="code" x="365" y="336">(lambda(x)…)</text><text class="label" x="365" y="362">31 bytes · mismatch</text></g>
  <g><rect class="box" x="345" y="400" width="190" height="80" rx="16"/><text class="code" x="365" y="436">(lambda(x)…)</text><text class="label" x="365" y="462">54 bytes · valid</text></g>
  <g class="pulse"><path d="M670 205h95v150h-95l-30-30v-90z" fill="#131827" stroke="url(#g)" stroke-width="2"/><text class="label" x="705" y="250" text-anchor="middle">BLOCK</text><text class="code" x="705" y="286" text-anchor="middle">38 B</text><text x="705" y="319" text-anchor="middle" fill="#7df0af" font-family="ui-monospace,monospace" font-size="13">ACCEPTED</text></g>
</svg>
